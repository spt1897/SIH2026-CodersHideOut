# version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  alert-service:
    build: .
    ports:
      - "8001:8001"
    env_file:           
      - .env
    environment:
      - REDIS_HOST=redis
      - EUREKA_SERVER=http://eureka:8761/eureka
      - PORT=8001
    depends_on:
      - redis