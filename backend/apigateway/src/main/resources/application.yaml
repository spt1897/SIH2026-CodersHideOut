spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true 

server:
  port: 8181

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

software:
  jwt:
    access:
      secret: ${JWT_ACCESS_SECRET}
      life: ${JWT_ACCESS_LIFE}